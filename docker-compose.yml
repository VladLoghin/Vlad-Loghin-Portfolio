services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./vladportfolio-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: portfolio
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    env_file:
      - ./vladportfolio-backend/.env
    depends_on:
      - db

  frontend:
    build: ./auth0-svelte
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
    env_file:
      - ./auth0-svelte/.env
    depends_on:
      - backend

volumes:
  pgdata:
