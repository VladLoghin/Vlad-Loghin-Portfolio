# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# For local dev + quick deploy: update
# For production (safer): validate + migrations (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Run data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Disable stuff that was H2/Docker-specific
spring.h2.console.enabled=false
spring.docker.compose.enabled=false
