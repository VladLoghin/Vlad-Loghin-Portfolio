# --- R2DBC PostgreSQL ---
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}

# Disable Docker Compose auto-start
spring.docker.compose.enabled=false

# --- WebFlux ---
spring.codec.max-in-memory-size=16MB

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost:3001

# --- Mail (Brevo SMTP) ---
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.adminTo=blade.loghin@gmail.com
app.mail.from=noreply@vladloghin.codes

# --- Auth0 JWT (Resource Server) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN:auth.vladloghin.codes}/
auth0.audience=${AUTH0_AUDIENCE:https://api.vladloghin.codes}

# --- Logging (dev) ---
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
