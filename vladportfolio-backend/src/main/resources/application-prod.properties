# --- R2DBC PostgreSQL (production) ---
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=require
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# --- WebFlux ---
spring.codec.max-in-memory-size=16MB

# --- CORS (production domain) ---
app.cors.allowed-origins=https://vladloghin.codes

# --- Mail (Brevo SMTP) ---
spring.mail.host=${BREVO_SMTP_HOST}
spring.mail.port=${BREVO_SMTP_PORT}
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.adminTo=blade.loghin@gmail.com
app.mail.from=noreply@vladloghin.codes

# --- Logging (production) ---
logging.level.root=WARN
logging.level.org.vlad=INFO

# --- Disable dev tools ---
spring.devtools.restart.enabled=false
