# Dev profile — auto-loaded by `docker compose up`
services:
  db:
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: portfolio
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    env_file:
      - ./vladportfolio-backend/.env
